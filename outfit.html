<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outfit Maker — FitVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* ---- design tokens, matching HomeView.swift Color extension ---- */
  :root{
    --cream:#F5EFE3; --cream-dim:#EAE2D2; --navy:#1C2640; --navy-dim:#5A6178;
    --olive:#8A8B5E; --amber:#B8863B; --amber-soft:#EFE0C4; --paper:#FBF8F1;
    --danger:#B4483B; --white:#ffffff;
    --tabbar-clearance:78px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--cream); color:var(--navy); font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  button{ font-family:inherit; }

  /* ===================== STAGE (mirrors NavigationStack + ZStack) ===================== */
  .stage{
    position:relative; height:100vh; width:100%; max-width:520px; margin:0 auto;
    display:flex; flex-direction:column; overflow:hidden;
    background:
      radial-gradient(circle at 8% 4%, rgba(138,139,94,0.10), transparent 40%),
      radial-gradient(circle at 96% 96%, rgba(184,134,59,0.10), transparent 42%),
      var(--cream);
  }

  /* ---- top toolbar ---- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 4px; flex:none; min-height:40px;
  }
  .tool-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--navy);
  }
  .tool-btn svg{ width:19px; height:19px; }
  .tool-btn:hover{ background:rgba(28,38,64,0.06); }

  .step-dots{ display:flex; gap:6px; align-items:center; justify-content:center; flex:1; }
  .step-dots i{
    display:block; height:6px; border-radius:99px; width:8px;
    background:rgba(28,38,64,0.15); transition:width .3s cubic-bezier(.4,0,.2,1), background .3s ease;
  }
  .step-dots i.filled{ background:var(--navy); }
  .step-dots i.current{ width:22px; background:var(--navy); }

  /* ---- center prompt (Gemini style) ---- */
  .center-wrap{
    flex:1; display:flex; align-items:center; justify-content:center; padding:20px 26px;
    min-height:0;
  }
  .center-prompt{
    text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px;
    max-width:400px; animation:promptIn .38s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes promptIn{
    from{ opacity:0; transform:translateY(10px) translateX(14px); }
    to{ opacity:1; transform:translateY(0) translateX(0); }
  }
  .sparkle-icon{
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  }
  .sparkle-icon svg{ width:30px; height:30px; }
  .sparkle-icon svg path{ fill:url(#sparkleGrad); }
  .center-prompt h1{
    font-family:'Inter',sans-serif; font-weight:600; font-size:25px; line-height:1.28; margin:0;
    color:var(--navy); letter-spacing:-0.01em;
  }

  /* ===================== BOTTOM CARD (safeAreaInset(edge:.bottom)) ===================== */
  .bottom-region{
    flex:none; background:transparent; padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .bottom-card{
    margin:0 16px; padding:16px; border-radius:28px;
    background:rgba(255,255,255,0.55); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(28,38,64,0.12);
    box-shadow:0 -4px 14px rgba(28,38,64,0.08);
    display:flex; flex-direction:column; gap:14px;
  }
  .bottom-region-inner{ padding-bottom:var(--tabbar-clearance); }

  .field-label{
    font-size:12.5px; font-weight:600; color:var(--navy-dim); margin:0;
  }

  /* ---- search capsule (destination step) ---- */
  .search-capsule{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:rgba(28,38,64,0.05); border:1px solid rgba(28,38,64,0.1); border-radius:99px;
  }
  .search-capsule svg{ width:17px; height:17px; color:var(--navy-dim); flex:none; }
  .search-capsule input{
    flex:1; border:none; background:transparent; outline:none; font-size:14.5px; color:var(--navy);
    font-family:'Inter',sans-serif;
  }
  .search-capsule input::placeholder{ color:var(--navy-dim); }
  .go-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:rgba(28,38,64,0.3);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; transition:background .15s;
  }
  .go-btn.enabled{ background:var(--navy); cursor:pointer; }
  .go-btn svg{ width:15px; height:15px; color:var(--cream); }

  /* ---- horizontal circle-option rail ---- */
  .hrail{
    display:flex; gap:14px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none;
  }
  .hrail::-webkit-scrollbar{ display:none; }
  .circle-opt{
    display:flex; flex-direction:column; align-items:center; gap:6px; width:64px; flex:none;
    cursor:pointer; background:none; border:none; padding:0;
  }
  .circle-opt .disc{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(28,38,64,0.06); border:1px solid rgba(28,38,64,0.14); transition:all .18s ease;
  }
  .circle-opt .disc svg{ width:19px; height:19px; color:var(--navy); }
  .circle-opt.selected .disc{
    background:var(--navy); border-color:transparent; box-shadow:0 6px 14px -4px rgba(28,38,64,0.4);
  }
  .circle-opt.selected .disc svg{ color:var(--cream); }
  .circle-opt span{
    font-size:11px; font-weight:600; color:var(--navy-dim); line-height:1.2; text-align:center;
  }
  .circle-opt.selected span{ color:var(--navy); }

  /* ---- continue / generate pill button ---- */
  .pill-btn{
    width:100%; border:none; border-radius:99px; background:var(--navy); color:var(--cream);
    font-size:15.5px; font-weight:700; padding:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease, opacity .15s ease;
  }
  .pill-btn:hover{ transform:translateY(-1px); }
  .pill-btn:disabled{ opacity:.6; cursor:default; transform:none; }
  .pill-btn svg{ width:15px; height:15px; }
  .spin{
    width:14px; height:14px; border:2px solid rgba(245,239,227,0.35); border-top-color:var(--cream);
    border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- labeled slider ---- */
  .lslider{ display:flex; flex-direction:column; gap:10px; }
  .lslider .row{ display:flex; align-items:center; justify-content:space-between; }
  .lslider .row h3{ margin:0; font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--navy); }
  .lslider .row .state{ font-size:13px; color:var(--navy-dim); text-transform:capitalize; }
  .lslider .track-row{ display:flex; align-items:center; gap:12px; }
  .lslider .track-row span{ font-size:11px; color:var(--navy-dim); flex:none; }
  .styled-range{ flex:1; -webkit-appearance:none; appearance:none; height:8px; border-radius:99px;
    background:linear-gradient(90deg, var(--olive), var(--navy)); outline:none; }
  .styled-range::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--cream);
    border:2px solid var(--navy); box-shadow:0 2px 4px rgba(28,38,64,0.25); cursor:pointer;
  }
  .styled-range::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; background:var(--cream); border:2px solid var(--navy); cursor:pointer;
  }

  /* ---- customize tap-one row ---- */
  .tap-one-row{ display:flex; gap:14px; }

  /* ---- customize details (scroll area) ---- */
  .details-scroll{ max-height:52vh; overflow-y:auto; display:flex; flex-direction:column; gap:22px; padding:2px 2px 6px; }
  .details-scroll::-webkit-scrollbar{ width:4px; }
  .details-scroll::-webkit-scrollbar-thumb{ background:rgba(28,38,64,0.15); border-radius:99px; }

  .dsec h3{ margin:0 0 12px; font-size:14.5px; font-weight:700; color:var(--navy); }
  .toggle-row2{ display:flex; align-items:center; justify-content:space-between; }
  .toggle-row2 span.tlabel{ font-size:14.5px; font-weight:700; color:var(--navy); }
  .switch2{ position:relative; width:44px; height:26px; flex:none; }
  .switch2 input{ opacity:0; width:0; height:0; position:absolute; }
  .switch2 .trk{ position:absolute; inset:0; background:rgba(28,38,64,0.2); border-radius:99px; cursor:pointer; transition:.2s; }
  .switch2 .trk::before{ content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch2 input:checked + .trk{ background:var(--olive); }
  .switch2 input:checked + .trk::before{ transform:translateX(18px); }

  .mode-picker{ display:flex; gap:4px; padding:4px; border-radius:99px; background:rgba(255,255,255,0.5); border:1px solid rgba(28,38,64,0.12); margin-top:12px; }
  .mode-picker button{
    flex:1; border:none; background:transparent; border-radius:99px; padding:9px 0; cursor:pointer;
    font-size:12px; font-weight:700; color:var(--navy);
  }
  .mode-picker button.active{ background:var(--navy); color:var(--cream); }
  .location-input{
    margin-top:12px; width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(28,38,64,0.18);
    background:rgba(255,255,255,0.5); font-size:14px; color:var(--navy); outline:none; font-family:'Inter',sans-serif;
  }
  .indoor-note{ margin:10px 0 0; font-size:12px; color:var(--navy-dim); }

  .piece-rail{ display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; }
  .piece-rail::-webkit-scrollbar{ display:none; }
  .piece-chip{ display:flex; flex-direction:column; align-items:center; gap:8px; width:100px; flex:none; }
  .piece-chip .thumb{
    width:100px; height:96px; border-radius:16px; background:var(--olive); position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden; opacity:.9;
    border:0 solid var(--navy);
  }
  .piece-chip .thumb img{ width:100%; height:100%; object-fit:cover; }
  .piece-chip.centerpiece .thumb{ border-width:2.5px; opacity:1; }
  .piece-chip .thumb button{
    position:absolute; width:22px; height:22px; border-radius:50%; border:none; background:var(--cream);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .piece-chip .thumb .rm{ top:6px; right:6px; }
  .piece-chip .thumb .crown{ top:6px; left:6px; }
  .piece-chip .thumb svg{ width:12px; height:12px; color:var(--navy); }
  .piece-chip .thumb.crowned .crown svg{ color:var(--olive); }
  .piece-chip .pname{ font-size:11.5px; font-weight:600; color:var(--navy); text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px; }
  .add-piece{
    width:100px; height:96px; border-radius:16px; background:rgba(28,38,64,0.04); flex:none;
    border:1.5px dashed rgba(28,38,64,0.28); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px; cursor:pointer; color:var(--navy);
  }
  .add-piece svg{ width:18px; height:18px; }
  .add-piece span{ font-size:10.5px; color:var(--navy-dim); }

  .chip-row2{ display:flex; flex-wrap:wrap; gap:10px; }
  .schip{
    font-size:13.5px; font-weight:700; padding:9px 15px; border-radius:99px; cursor:pointer;
    background:rgba(255,255,255,0.5); border:1px solid rgba(28,38,64,0.18); color:var(--navy);
  }
  .schip.active{ background:var(--navy); border-color:transparent; color:var(--cream); }

  .swatch-row{ display:flex; gap:12px; overflow-x:auto; padding:2px; scrollbar-width:none; }
  .swatch-row::-webkit-scrollbar{ display:none; }
  .swatch{
    width:36px; height:36px; border-radius:50%; flex:none; border:1px solid rgba(28,38,64,0.25);
    position:relative; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .swatch svg{ width:13px; height:13px; }

  .prompt-box{
    width:100%; min-height:70px; padding:12px 14px; border-radius:14px; border:1px solid rgba(28,38,64,0.18);
    background:rgba(255,255,255,0.5); font-size:14px; color:var(--navy); font-family:'Inter',sans-serif;
    resize:vertical; outline:none;
  }
  .gen-error{ font-size:12.5px; color:var(--danger); text-align:center; }

  /* ===================== SHEETS (modals) ===================== */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(20,26,44,0.4); display:none; align-items:flex-end;
    justify-content:center; z-index:50;
  }
  .sheet-backdrop.show{ display:flex; }
  .sheet{
    width:100%; max-width:520px; max-height:88vh; background:var(--cream); border-radius:26px 26px 0 0;
    display:flex; flex-direction:column; overflow:hidden; animation:sheetUp .28s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheetUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px;
    border-bottom:1px solid rgba(28,38,64,0.08); flex:none;
  }
  .sheet-head h2{ margin:0; font-family:'Fraunces',serif; font-weight:500; font-size:17px; }
  .sheet-head button{
    border:none; background:transparent; color:var(--navy); font-weight:700; font-size:14px; cursor:pointer;
    padding:6px 4px;
  }
  .sheet-body{ padding:18px; overflow-y:auto; }

  /* saved outfits grid */
  .saved-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .saved-card{ display:flex; flex-direction:column; gap:8px; }
  .saved-card .cover{
    height:150px; border-radius:16px; background:var(--olive); opacity:.88; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .saved-card .cover img{ width:100%; height:100%; object-fit:cover; }
  .saved-card .cover svg{ width:32px; height:32px; color:#fff; opacity:.6; }
  .saved-card .icon-btn{
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .saved-card .icon-btn svg{ width:12px; height:12px; color:var(--navy); }
  .saved-card .cname{ font-size:13px; font-weight:700; }
  .saved-card .cocc{ font-size:11px; color:var(--navy-dim); }
  .old-empty{ text-align:center; padding:50px 10px; color:var(--navy-dim); }
  .old-empty h3{ font-family:'Fraunces',serif; font-weight:500; color:var(--navy); margin:0 0 6px; font-size:18px; }
  .old-empty p{ margin:0 0 16px; font-size:13px; }
  .loading-txt{ font-size:13px; color:var(--navy-dim); text-align:center; padding:30px 0; }

  /* result sheet */
  .result-caption{ font-size:14.5px; font-weight:600; color:var(--navy); margin:0 0 8px; }
  .note-block{ background:var(--amber-soft); border-radius:10px; padding:12px 14px; font-size:12.5px; line-height:1.55; color:#5f4a1f; margin-bottom:10px; }
  .note-block b{ color:var(--navy); }
  .piece-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(110px,1fr)); gap:10px; margin-bottom:16px; }
  .piece-card{ background:var(--paper); border-radius:12px; overflow:hidden; border:1px solid rgba(28,38,64,0.08); }
  .piece-card .ph{ aspect-ratio:1; background:var(--cream-dim); }
  .piece-card .ph img{ width:100%; height:100%; object-fit:cover; }
  .piece-card .pc-meta{ padding:7px 9px 9px; }
  .piece-card .pc-role{ font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--amber); font-weight:700; }
  .piece-card .pc-name{ font-size:12px; font-weight:700; margin-top:2px; }
  .piece-role-list{ display:flex; flex-direction:column; gap:7px; margin-bottom:6px; }
  .piece-role-list .prow{ display:flex; gap:8px; align-items:flex-start; }
  .piece-role-list .prole{ width:70px; flex:none; font-size:11px; font-weight:700; color:var(--navy); text-transform:capitalize; }
  .piece-role-list .preason{ font-size:11px; color:var(--navy-dim); }

  .save-row{ display:flex; gap:10px; margin-top:18px; }
  .save-row input{
    flex:1; padding:12px 14px; border-radius:12px; border:1.5px solid rgba(28,38,64,0.14);
    background:var(--paper); font-size:14px; color:var(--navy); outline:none; font-family:'Inter',sans-serif;
  }
  .save-row button{
    border:1.5px solid rgba(28,38,64,0.18); background:transparent; color:var(--navy); font-weight:700;
    border-radius:12px; padding:0 18px; cursor:pointer; font-size:13.5px;
  }
  .save-status{ text-align:center; font-size:12.5px; margin-top:10px; color:var(--olive); font-weight:600; display:none; }
  .save-status.show{ display:block; }
  .save-status.is-error{ color:var(--danger); }
</style>
</head>
<body>

<!-- inline SVG defs for the sparkle gradient -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A8B5E"/>
      <stop offset="1" stop-color="#1C2640"/>
    </linearGradient>
  </defs>
</svg>

<div class="stage">

  <!-- ===== toolbar ===== -->
  <div class="toolbar">
    <button class="tool-btn" id="btn-back" style="visibility:hidden;" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="tool-btn" id="btn-exit" aria-label="Exit to home" title="Exit to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
    </button>

    <div class="step-dots" id="step-dots"></div>

    <button class="tool-btn" id="btn-saved" aria-label="View saved outfits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
    </button>
  </div>

  <!-- ===== center prompt ===== -->
  <div class="center-wrap">
    <div class="center-prompt" id="center-prompt">
      <div class="sparkle-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4z"/></svg>
      </div>
      <h1 id="prompt-headline">Where are we headed?</h1>
    </div>
  </div>

  <!-- ===== bottom card region ===== -->
  <div class="bottom-region">
    <div class="bottom-region-inner">
      <div class="bottom-card" id="bottom-card"><!-- step content injected here --></div>
    </div>
  </div>
</div>

<!-- ===== saved outfits sheet ===== -->
<div class="sheet-backdrop" id="saved-backdrop">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Saved Outfits</h2>
      <button id="btn-close-saved">Done</button>
    </div>
    <div class="sheet-body">
      <div class="loading-txt" id="saved-loading">Loading…</div>
      <div class="saved-grid" id="saved-grid" style="display:none;"></div>
      <div class="old-empty" id="saved-empty" style="display:none;">
        <h3>No saved outfits yet</h3>
        <p>Create your first outfit and it'll live here.</p>
        <button class="pill-btn" id="btn-empty-create" style="width:auto; padding:11px 22px;">+ Create outfit</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== result sheet ===== -->
<div class="sheet-backdrop" id="result-backdrop">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Your Look</h2>
      <button id="btn-close-result">Done</button>
    </div>
    <div class="sheet-body">
      <p class="result-caption" id="result-caption" style="font-family:'Fraunces',serif; font-weight:500; font-size:21px; line-height:1.3;"></p>
      <div class="piece-grid" id="piece-grid"></div>
      <div class="note-block" id="result-styling" style="display:none;"></div>
      <div class="note-block" id="result-weather" style="display:none;"></div>

      <div class="save-row">
        <input type="text" id="outfit-name" placeholder="Name this outfit" maxlength="60">
        <button id="btn-save-outfit">Save</button>
      </div>
      <div class="save-status" id="save-status"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   Supabase client / data plumbing (unchanged contract from before —
   generate-outfit edge function, `outfits` + `clothing_items` tables)
   ========================================================================= */
const sb = window.supabase.createClient(

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================================
   CLIENT-SIDE INPUT HARDENING
   ---------------------------------------------------------------------------
   IMPORTANT: everything in this block is a UX nicety, not a security
   boundary. A malicious actor can bypass all of it by calling the
   `generate-outfit` / `outfits` endpoints directly with curl/Postman using
   the same publishable key that's sitting in this file's source. Anything
   that actually needs to be enforced (prompt-injection resistance, rate
   limits, request size caps, auth/ownership checks, content moderation)
   MUST be implemented server-side, in the Supabase Edge Function and via
   Postgres Row Level Security — see the comment above `generateOutfit()`
   below for the specific server-side checklist. This block just keeps
   well-behaved users from accidentally sending garbage, and gives a faster
   "no" than round-tripping to the server for obviously-bad input.
   ========================================================================= */

// Strip characters outside printable ASCII (+ newline/tab) so lookalike
// glyphs, zero-width joiners, RTL override marks, and other unicode
// tricks that are sometimes used to smuggle instructions past a prompt
// can't ride along in free-text fields. This is deliberately conservative;
// if legitimate non-English input is ever needed, that's a product
// decision to revisit alongside the server-side validation, not something
// to loosen here unilaterally.
function stripToPrintableAscii(str){
  return String(str).replace(/[^\x20-\x7E\n\t]/g, '');
}

// Trim to a max length after stripping, so pasted walls of text can't be
// used to pad out a request (cheap client-side guard against
// prompt-stuffing; the edge function should enforce its own limit too).
function sanitizeText(str, maxLen){
  return stripToPrintableAscii(str).slice(0, maxLen);
}

// well-intentioned tester from hammering the button (and burning model
// spend) by accident — real rate limiting belongs on the edge function,
// keyed off the authenticated user id, not the browser.
const GENERATE_COOLDOWN_MS = 4000;

async function invokeEdgeFunction(name, body){
  const { data, error } = await sb.functions.invoke(name, { body });
  if (error) {
    let detail = error.message || 'Request failed.';
    if (error.context) {
      try {
        const cloned = error.context.clone ? error.context.clone() : error.context;
        const json = await cloned.json();
        detail = json.error || json.message || JSON.stringify(json);
      } catch (_) {
        try { detail = await error.context.text(); } catch (_) { /* keep default */ }
      }
    }
    throw new Error(detail);
  }
  return data;
}

function labeledSliderHTML(id, title, value, lowLabel, highLabel){
  const label = value < 0.34 ? lowLabel : (value < 0.67 ? 'moderate' : highLabel);
  return `

      <div class="row"><h3>${title}</h3><span class="state" data-low="${lowLabel}" data-high="${highLabel}">${label}</span></div>

function wireSlider(id, setter){
  const el = document.getElementById(id);
  el.addEventListener('input', e => {
    setter(parseFloat(e.target.value));
    // re-render just the state label without losing focus
    const row = el.closest('.lslider').querySelector('.state');
    const v = parseFloat(e.target.value);
    row.textContent = v < 0.34 ? row.dataset.low : (v < 0.67 ? 'moderate' : row.dataset.high);
  });
}

  document.getElementById('silhouette-chips').querySelectorAll('.schip').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedSilhouette = state.selectedSilhouette === btn.dataset.s ? null : btn.dataset.s;
      rerenderDetailsInPlace();
    });
  });
}

// colors
function renderColorsSection(){
  return `
    <div class="dsec">
      <div class="toggle-row2">
        <span class="tlabel">Include specific colors</span>
        <span class="switch2"><input type="checkbox" id="colors-toggle" ${state.includeColors?'checked':''}><span class="trk"></span></span>
      </div>
      <div class="swatch-row" id="swatch-row" style="display:${state.includeColors?'flex':'none'}; margin-top:12px;">
        ${PALETTE.map(p => `
          <div class="swatch" data-c="${p.name}" style="background:${p.hex};">
            ${state.selectedColors.has(p.name) ? `<span style="color:${p.hex==='#ffffff'||p.hex==='#F5EFE3'?'#1C2640':'#fff'};">${ICONS.check}</span>` : ''}
          </div>`).join('')}
      </div>
    </div>`;
}
function wireColorsSection(){
  document.getElementById('colors-toggle').addEventListener('change', e => {
    state.includeColors = e.target.checked;
    document.getElementById('swatch-row').style.display = state.includeColors ? 'flex' : 'none';
  });
  document.getElementById('swatch-row').querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      const c = sw.dataset.c;
      state.selectedColors.has(c) ? state.selectedColors.delete(c) : state.selectedColors.add(c);
      rerenderDetailsInPlace();
    });
  });
}

// secondary vibe
function renderSecondaryVibeSection(){
  const options = VIBES.filter(v => v !== state.selectedVibe);
  return `
    <div class="dsec">
      <h3>Blend in a secondary vibe</h3>
      <div class="chip-row2" id="secondary-vibe-chips">
        ${options.map(v => `<button class="schip ${state.secondaryVibes.has(v)?'active':''}" data-v="${v}">${v}</button>`).join('')}
      </div>
    </div>`;
}
function wireSecondaryVibeSection(){
  document.getElementById('secondary-vibe-chips').querySelectorAll('.schip').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.v;
      state.secondaryVibes.has(v) ? state.secondaryVibes.delete(v) : state.secondaryVibes.add(v);
      btn.classList.toggle('active');
    });
  });
}

// prompt
function renderPromptSection(){
  return `
    <div class="dsec">
      <h3>Add a prompt</h3>
      <textarea class="prompt-box" id="prompt-text" maxlength="${LIMITS.prompt}" placeholder="e.g. something cozy for a rainy lunch with friends">${escapeHtml(state.promptText)}</textarea>
      <p style="font-size:11px; color:var(--navy-dim); text-align:right; margin:4px 2px 0;" id="prompt-count">${state.promptText.length}/${LIMITS.prompt}</p>
    </div>`;
}
function wirePromptSection(){
  const el = document.getElementById('prompt-text');
  const counter = document.getElementById('prompt-count');
  el.addEventListener('input', e => {
    const clean = sanitizeText(e.target.value, LIMITS.prompt);
    if (clean !== e.target.value) e.target.value = clean;
    state.promptText = clean;
    counter.textContent = `${clean.length}/${LIMITS.prompt}`;
  });
}

// re-render the customize details without losing scroll position, mostly for chip toggles
function rerenderDetailsInPlace(){
  const scrollTop = document.getElementById('details-scroll')?.scrollTop || 0;
  renderCustomizeCard();
  const ds = document.getElementById('details-scroll');
  if (ds) ds.scrollTop = scrollTop;
}

function renderAll(){
  renderToolbar();
  renderCenterPrompt();
  renderBottomCard();
}
renderAll();

/* =========================================================================
   GENERATE
   ---------------------------------------------------------------------------
   SERVER-SIDE TODO (this frontend cannot enforce any of this — it only
   ships a publishable key, so treat every field in `body` below as
   attacker-controlled input arriving at the edge function):

   1. Prompt-injection resistance: `prompt`, `occasion`, `custom_location`
      (and any other free-text field) must be treated as untrusted data,
      not instructions, when assembled into the LLM call. Use a fixed
      system prompt the user input can't override, and don't let the
      model's output re-enter the request pipeline unsanitized.
   2. Input validation: re-validate types/ranges/lengths server-side
      (don't trust that the client enforced LIMITS or ASCII-only — this JS
      is fully visible/editable by anyone hitting the function directly).
      Reject or truncate oversized payloads before they reach the model.
   3. Auth + ownership: verify the Supabase JWT on every call, and scope
      `specific_piece_ids` / `centerpiece_id` lookups to items owned by
      that authenticated user — never trust IDs from the client as-is.
   4. Rate limiting & quota: enforce per-user (and ideally per-IP) request
      limits and a cost/quota ceiling in the edge function itself (e.g. via
      a Postgres table tracking calls per user per time window). The
      client-side cooldown below is a UX nicety only, trivially bypassed.
   5. Output handling: cap response size, and sanitize/escape anything from
      the model before it's stored or rendered (this file already escapes
      on render, but the edge function should not blindly trust model
      output either, e.g. if it were ever used to build further queries).
   6. RLS: confirm Row Level Security policies on `outfits` and
      `clothing_items` restrict reads/writes to the owning user — the
      publishable key alone provides no isolation between testers.
   ========================================================================= */
async function generateOutfit(){
  if (state.isGenerating) return;

  const now = Date.now();
  if (now - lastGenerateAt < GENERATE_COOLDOWN_MS) {
    state.generationError = 'Give it a few seconds between generations.';
    renderCustomizeCard();
    return;
  }
  if (generateCountThisSession >= GENERATE_MAX_PER_SESSION) {
    state.generationError = "You've hit the generation limit for this session — refresh to continue testing.";
    renderCustomizeCard();
    return;
  }

  state.isGenerating = true;
  state.generationError = null;
  renderCustomizeCard();

  const weatherModeWire = { myLocation:'My Location', choose:'Choose', indoors:'Indoors' }[state.weatherMode];

  const body = {
    occasion: state.selectedOccasion ? sanitizeText(state.selectedOccasion, LIMITS.occasion) : null,
    vibe: state.selectedVibe,
    secondary_vibes: [...state.secondaryVibes],
    layer_amount: clamp01(state.layerAmount),
    statement_amount: clamp01(state.statementAmount),
    formality_amount: clamp01(state.formalityAmount),
    silhouette: state.selectedSilhouette || null,
    colors: state.includeColors ? [...state.selectedColors] : [],
    account_for_weather: state.accountForWeather,
    weather_mode: weatherModeWire,
    custom_location: state.weatherMode === 'choose' ? (sanitizeText(state.customLocationText, LIMITS.location) || null) : null,
    specific_piece_ids: [...state.addedPieceIds],
    centerpiece_id: state.centerpieceId,
    use_clean_only: state.useCleanOnly,
    prompt: sanitizeText(state.promptText, LIMITS.prompt).trim() || null
  };

  lastGenerateAt = now;
  generateCountThisSession += 1;

  try {
    const data = await invokeEdgeFunction('generate-outfit', body);
    if (!data) throw new Error('No outfit came back — try again.');
    lastResult = data;
    state.isGenerating = false;
    renderCustomizeCard();
    openResultSheet(data);
  } catch (err) {
    const msg = err.message || '';
    state.generationError = /empty_closet/i.test(msg)
      ? 'Add a few items to your closet first, then try again.'
      : (msg || 'Something went wrong generating that outfit.');
    state.isGenerating = false;
    renderCustomizeCard();
  }
}
function clamp01(n){ return Math.min(1, Math.max(0, Number(n) || 0)); }

/* =========================================================================
   RESULT SHEET — mirrors GeneratedOutfitResultView + OutfitPieceStack
   ========================================================================= */
const resultBackdrop = document.getElementById('result-backdrop');
document.getElementById('btn-close-result').addEventListener('click', () => resultBackdrop.classList.remove('show'));
resultBackdrop.addEventListener('click', e => { if (e.target === resultBackdrop) resultBackdrop.classList.remove('show'); });

const TONES = ['#8A8B5E', '#1C2640', 'rgba(138,139,94,0.6)', 'rgba(28,38,64,0.6)', 'rgba(138,139,94,0.8)'];

function openResultSheet(outfit){
  document.getElementById('result-caption').textContent = outfit.caption || '';

  const grid = document.getElementById('piece-grid');
  grid.innerHTML = '';
  (outfit.pieces || []).forEach(piece => {
    const item = closetItems.find(ci => ci.id === piece.id);
    const card = document.createElement('div');
    card.className = 'piece-card';
    card.innerHTML = `
      <div class="ph">${item?.image_url ? `<img src="${item.image_url}">` : ''}</div>
      <div class="pc-meta">
        <div class="pc-role">${escapeHtml(piece.role || '')}</div>
        <div class="pc-name">${escapeHtml(item?.name || 'Item')}</div>
      </div>`;
    grid.appendChild(card);
  });

  const stylingEl = document.getElementById('result-styling');
  if (outfit.styling_notes) {
    stylingEl.style.display = 'block';
    stylingEl.innerHTML = `<b>Styling notes:</b> ${escapeHtml(outfit.styling_notes)}`;
  } else stylingEl.style.display = 'none';

  const weatherEl = document.getElementById('result-weather');
  if (outfit.weather_note) {
    weatherEl.style.display = 'block';
    weatherEl.innerHTML = `<b>Weather:</b> ${escapeHtml(outfit.weather_note)}`;
  } else weatherEl.style.display = 'none';

  document.getElementById('outfit-name').value = outfit.caption ? outfit.caption.slice(0, 40) : 'My outfit';
  document.getElementById('save-status').classList.remove('show');
  resultBackdrop.classList.add('show');
}

document.getElementById('outfit-name').addEventListener('input', e => {
  const clean = sanitizeText(e.target.value, LIMITS.outfitName);
  if (clean !== e.target.value) e.target.value = clean;
});

document.getElementById('btn-save-outfit').addEventListener('click', async () => {
  if (!lastResult) return;
  const statusEl = document.getElementById('save-status');
  const name = sanitizeText(document.getElementById('outfit-name').value.trim(), LIMITS.outfitName) || 'My outfit';

  statusEl.classList.remove('is-error');
  statusEl.classList.add('show');
  statusEl.textContent = 'Saving…';

  try {
    const { error } = await sb.from('outfits').insert({
      name,
      occasion: state.selectedOccasion || null,
      item_ids: (lastResult.pieces || []).map(p => p.id)
    });
    if (error) throw error;
    statusEl.textContent = 'Saved to My Outfits.';
  } catch (err) {
    statusEl.textContent = err.message || "Couldn't save that outfit.";
    statusEl.classList.add('is-error');
  }
});

/* =========================================================================
   SAVED OUTFITS SHEET
   ========================================================================= */
const savedBackdrop = document.getElementById('saved-backdrop');
const savedLoading = document.getElementById('saved-loading');
const savedGrid = document.getElementById('saved-grid');
const savedEmpty = document.getElementById('saved-empty');

function openSavedSheet(){
  savedBackdrop.classList.add('show');
  loadSavedOutfits();
}
document.getElementById('btn-close-saved').addEventListener('click', () => savedBackdrop.classList.remove('show'));
savedBackdrop.addEventListener('click', e => { if (e.target === savedBackdrop) savedBackdrop.classList.remove('show'); });
document.getElementById('btn-empty-create').addEventListener('click', () => {
  savedBackdrop.classList.remove('show');
  goToStep(0);
});

async function loadSavedOutfits(){
  savedLoading.style.display = 'block'; savedLoading.textContent = 'Loading…';
  savedGrid.style.display = 'none'; savedEmpty.style.display = 'none';

  const { data, error } = await sb.from('outfits').select('*').order('created_at', { ascending:false });
  savedLoading.style.display = 'none';

  if (error) { savedLoading.style.display = 'block'; savedLoading.textContent = "Couldn't load saved outfits — try refreshing."; return; }
  if (!data || !data.length) { savedEmpty.style.display = 'block'; return; }

  savedGrid.style.display = 'grid';
  savedGrid.innerHTML = '';
  data.forEach(outfit => {
    const firstItem = closetItems.find(ci => (outfit.item_ids || []).includes(ci.id));
    const card = document.createElement('div');
    card.className = 'saved-card';
    card.innerHTML = `
      <div class="cover">
        ${firstItem?.image_url ? `<img src="${firstItem.image_url}">` : ICONS.hanger}
        <button class="icon-btn" data-id="${outfit.id}" title="Delete">${ICONS.trash}</button>
      </div>
      <div class="cname">${escapeHtml(outfit.name || 'Outfit')}</div>
      <div class="cocc">${escapeHtml(outfit.occasion || '')}</div>`;
    card.querySelector('.icon-btn').addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm(`Delete "${outfit.name || 'this outfit'}"?`)) return;
      await sb.from('outfits').delete().eq('id', outfit.id);
      loadSavedOutfits();
    });
    savedGrid.appendChild(card);
  });
}
</script>
