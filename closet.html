  <!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closet — FitVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{
      --cream:#F5EFE3; --cream-dim:#EAE2D2; --navy:#1C2640; --navy-dim:#5A6178;
      --olive:#8A8B5E; --amber:#B8863B; --amber-soft:#EFE0C4; --paper:#FBF8F1;
      --danger:#B4483B; --radius:16px;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--cream); color:var(--navy); font-family:'Inter',sans-serif;
      background-image:
        radial-gradient(circle at 8% 6%, rgba(138,139,94,0.08), transparent 38%),
        radial-gradient(circle at 94% 92%, rgba(184,134,59,0.08), transparent 40%);
      min-height:100vh;
    }
    a{ color:inherit; }

    /* ---- Nav ---- */
    nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 22px; background:var(--paper); border-bottom:1px solid rgba(28,38,64,0.08);
      position:sticky; top:0; z-index:20;
    }
    .brand{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
    .navlinks{ display:flex; gap:6px; align-items:center; }
    .navlinks a, .navlinks button{
      font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--navy-dim);
      text-decoration:none; padding:8px 13px; border-radius:9px; border:none; background:transparent; cursor:pointer;
    }
    .navlinks a.active{ background:var(--navy); color:var(--cream); }
    .navlinks a:hover, .navlinks button:hover{ color:var(--navy); }

    main{ max-width:920px; margin:0 auto; padding:30px 20px 80px; }

    .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; gap:14px; flex-wrap:wrap; }
    .page-head h1{ font-family:'Fraunces',serif; font-weight:500; font-size:28px; margin:0 0 3px; }
    .page-head p{ margin:0; font-size:13px; color:var(--navy-dim); }

    .btn{
      border:none; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
      padding:12px 20px; border-radius:11px; background:var(--navy); color:var(--cream);
      transition:transform .15s ease, background .15s ease;
    }
    .btn:hover{ background:#141c33; transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }
    .btn.ghost{ background:transparent; color:var(--navy); border:1.5px solid rgba(28,38,64,0.18); }
    .btn.ghost:hover{ background:rgba(28,38,64,0.05); }
    .btn[disabled]{ opacity:.55; cursor:default; transform:none !important; }
    .spin{
      display:inline-block; width:13px; height:13px; margin-right:7px; vertical-align:-2px;
      border:2px solid rgba(245,239,227,0.35); border-top-color:var(--cream); border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg);} }

    /* ---- Grid ---- */
    .grid{
      display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px;
    }
    .item-card{
      background:var(--paper); border-radius:14px; overflow:hidden;
      box-shadow:0 1px 0 rgba(28,38,64,0.04), 0 10px 26px -18px rgba(28,38,64,0.3);
    }
    .item-card .thumb{
      aspect-ratio:1; background:var(--cream-dim); display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    .item-card .thumb img{ width:100%; height:100%; object-fit:cover; }
    .item-card .meta{ padding:10px 12px 12px; }
    .item-card .meta .name{ font-weight:700; font-size:13.5px; }
    .item-card .meta .sub{ font-size:11.5px; color:var(--navy-dim); margin-top:2px; }

    .empty-state{
      text-align:center; padding:70px 20px; color:var(--navy-dim);
    }
    .empty-state svg{ width:38px; height:38px; margin-bottom:12px; opacity:.6; }
    .empty-state h3{ font-family:'Fraunces',serif; font-weight:500; color:var(--navy); margin:0 0 6px; font-size:19px; }
    .empty-state p{ margin:0 0 18px; font-size:13px; }

    /* ---- Modal shell ---- */
    .modal-backdrop{
      display:none; position:fixed; inset:0; background:rgba(20,26,44,0.55);
      align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;
    }
    .modal-backdrop.show{ display:flex; }
    .modal{
      background:var(--paper); border-radius:20px; width:100%; max-width:560px;
      padding:26px 24px 24px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.4);
      animation:rise .35s cubic-bezier(.2,.7,.3,1);
    }
    @keyframes rise{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
    .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .modal-head h2{ font-family:'Fraunces',serif; font-weight:500; font-size:20px; margin:0; }
    .modal-head button{ background:none; border:none; cursor:pointer; color:var(--navy-dim); font-size:20px; line-height:1; padding:4px; }

    /* Step 1: photo picker — sized to fit the picked photo's own aspect
      ratio rather than always forcing a fixed box, but capped so it never
      blows out the viewport on small screens. */
    .dropzone{
      border:1.5px dashed rgba(28,38,64,0.28); border-radius:16px; background:rgba(28,38,64,0.03);
      min-height:200px; max-height:58vh; display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden; text-align:center; padding:6px;
    }
    .dropzone img{ display:block; width:100%; height:auto; max-height:calc(58vh - 12px); object-fit:contain; border-radius:10px; }
    .dropzone .placeholder{ color:var(--navy-dim); font-size:13px; padding:0 20px; }
    .dropzone .placeholder svg{ width:30px; height:30px; margin-bottom:8px; opacity:.6; }
    .dropzone.busy .placeholder{ display:flex; flex-direction:column; align-items:center; gap:10px; }

    .source-row{ display:flex; gap:10px; margin:14px 0 4px; }
    .source-row label, .source-row button{
      flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
      font-size:12px; font-weight:600; color:var(--navy); background:rgba(28,38,64,0.05);
      border:none; border-radius:11px; padding:12px 8px; cursor:pointer;
    }
    .source-row svg{ width:19px; height:19px; }
    .source-row input[type=file]{ display:none; }

    .hint{
      display:flex; gap:8px; align-items:flex-start; background:var(--amber-soft); border-radius:10px;
      padding:10px 12px; font-size:11.5px; line-height:1.5; color:#5f4a1f; margin:14px 0;
    }
    .hint svg{ flex:none; width:14px; height:14px; margin-top:2px; }

    .modal-error{ font-size:12.5px; color:var(--danger); margin-top:8px; }

    /* Step 2: review rows */
    .review-list{ display:flex; flex-direction:column; gap:10px; max-height:52vh; overflow-y:auto; padding-right:2px; margin-bottom:4px; }
    .review-row{ display:flex; gap:12px; padding:10px; border-radius:14px; background:rgba(28,38,64,0.03); }
    .review-row .check{ flex:none; padding-top:5px; }
    .review-row .check input{ width:18px; height:18px; accent-color:var(--navy); cursor:pointer; }
    .review-row .thumb{ flex:none; width:60px; height:60px; border-radius:10px; overflow:hidden; background:var(--cream-dim); }
    .review-row .thumb img{ width:100%; height:100%; object-fit:cover; }
    .review-row .fields{ flex:1; min-width:0; opacity:1; transition:opacity .15s ease; }
    .review-row.excluded .fields{ opacity:.42; }
    .review-row .dup-badge{
      display:inline-block; font-size:10px; font-weight:700; color:var(--olive);
      background:rgba(138,139,94,0.16); padding:2px 7px; border-radius:99px; margin-bottom:5px;
    }
    .review-row input[type=text]{
      width:100%; border:1px solid rgba(28,38,64,0.14); border-radius:8px; background:var(--cream);
      font-size:12.5px; padding:6px 8px; margin-bottom:5px; font-family:'Inter',sans-serif; color:var(--navy);
    }
    .review-row input[type=text]:last-of-type{ margin-bottom:6px; }
    .cat-row{ display:flex; gap:4px; flex-wrap:wrap; }
    .cat-pill{
      font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:99px; cursor:pointer; border:none;
      background:rgba(28,38,64,0.08); color:var(--navy);
    }
    .cat-pill.active{ background:var(--navy); color:var(--cream); }

    .modal-foot{ display:flex; gap:10px; margin-top:18px; }
    .modal-foot .btn{ flex:1; }
    .save-status{ text-align:center; font-size:12.5px; margin-top:10px; color:var(--olive); font-weight:600; display:none; }
    .save-status.show{ display:block; }
    .save-status.is-error{ color:var(--danger); }
  </style>
  </head>
  <body>

  <nav>
    <div class="brand">FitVault</div>
    <div class="navlinks">
      <a href="closet.html" class="active">Closet</a>
      <a href="outfit.html">Outfit Maker</a>
      <button id="btn-signout">Sign out</button>
    </div>
  </nav>

  <main>
    <div class="page-head">
      <div>
        <h1>Your closet</h1>
        <p id="closet-count">Loading…</p>
      </div>
      <button class="btn" id="btn-open-add">+ Add item</button>
    </div>

    <div id="grid" class="grid"></div>

    <div id="empty" class="empty-state" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1C2640" stroke-width="1.6"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.2"/></svg>
      <h3>Nothing in here yet</h3>
      <p>Snap what you're wearing or lay out a few pieces — AI finds the rest.</p>
      <button class="btn" id="btn-open-add-empty">+ Add your first item</button>
    </div>
  </main>

  <!-- ============= Item detail popup ============= -->
  <div class="modal-backdrop" id="detail-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 id="detail-name">Item</h2>
        <button id="btn-close-detail">&times;</button>
      </div>
      <div id="detail-photo-wrap" style="width:100%; aspect-ratio:1.3; border-radius:14px; margin-bottom:16px; overflow:hidden; background:var(--cream-dim);"></div>
      <div id="detail-tags" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;"></div>
      <div id="detail-fields" style="display:flex; flex-direction:column; gap:8px; font-size:13px; color:var(--navy-dim); margin-bottom:18px;"></div>
      <div class="modal-foot">
        <button class="btn ghost" id="btn-close-detail-2">Close</button>
        <button class="btn" id="btn-delete-item" style="background:var(--danger);">Delete item</button>
      </div>
      <div class="save-status" id="detail-status"></div>
    </div>
  </div>

  <!-- ============= Add Item modal ============= -->
  <div class="modal-backdrop" id="add-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title">New item</h2>
        <button id="btn-close-modal">&times;</button>
      </div>

      <!-- STEP 1: pick / detect -->
      <div id="step-photo">
        <div class="dropzone" id="dropzone">
          <img id="preview-img" style="display:none;">
          <div class="placeholder" id="dz-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="#5A6178" stroke-width="1.6"><path d="M12 4v13M6 11l6-6 6 6"/><path d="M4 19h16"/></svg>
            No photo yet
          </div>
        </div>

        <div class="source-row">
          <label>
            <svg viewBox="0 0 24 24" fill="none" stroke="#1C2640" stroke-width="1.7"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>
            Camera
            <input type="file" accept="image/*" capture="environment" id="file-camera">
          </label>
          <label>
            <svg viewBox="0 0 24 24" fill="none" stroke="#1C2640" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Library
            <input type="file" accept="image/*" id="file-library">
          </label>
        </div>

        <div class="hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5f4a1f" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.3" r="0.6" fill="#5f4a1f"/></svg>
          <span>This photo goes to an AI vision model to identify pieces — keep faces out of frame.</span>
        </div>

        <div class="modal-error" id="step-photo-error"></div>

        <div class="modal-foot">
          <button class="btn" id="btn-find-pieces" disabled>Find my pieces</button>
        </div>
      </div>

      <!-- STEP 2: review detected items -->
      <div id="step-review" style="display:none;">
        <p id="review-subhead" style="font-size:12.5px; color:var(--navy-dim); margin:0 0 12px;"></p>
        <div class="review-list" id="review-list"></div>
        <div class="modal-foot">
          <button class="btn ghost" id="btn-back-to-photo">Back</button>
          <button class="btn" id="btn-save-items">Add to closet</button>
        </div>
        <div class="save-status" id="save-status"></div>
      </div>
    </div>
  </div>

  <script>
    // Same project as index.html / SupabaseManager.swift.
    const sb = window.supabase.createClient(
      'https://wlsmzjinhshofltkmqar.supabase.co',
      'sb_publishable_vij6ww92GvSVMkAnbr55EA_CblYU45C'
    );

    const CATEGORIES = ["Tops", "Bottoms", "Outerwear", "Shoes", "Accessories"];

    // ---------- auth guard ----------
    let currentUser = null;
    sb.auth.getSession().then(({ data }) => {
      if (!data.session) { window.location.href = 'index.html'; return; }
      currentUser = data.session.user;
      loadCloset();
    });
    document.getElementById('btn-signout').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    });

    // ---------- closet grid ----------
    const grid = document.getElementById('grid');
    const emptyEl = document.getElementById('empty');
    const countEl = document.getElementById('closet-count');
    let closetCache = [];

    async function loadCloset(){
      const { data, error } = await sb
        .from('clothing_items')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        countEl.textContent = "Couldn't load your closet — try refreshing.";
        return;
      }
      closetCache = data || [];
      renderGrid(closetCache);
    }

    function renderGrid(items){
      grid.innerHTML = '';
      if (!items.length) {
        grid.style.display = 'none';
        emptyEl.style.display = 'block';
        countEl.textContent = 'Empty for now.';
        return;
      }
      grid.style.display = 'grid';
      emptyEl.style.display = 'none';
      countEl.textContent = `${items.length} piece${items.length === 1 ? '' : 's'}`;

      for (const item of items) {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.style.cursor = 'pointer';
        card.innerHTML = `
          <div class="thumb">${item.image_url ? `<img src="${item.image_url}" alt="${escapeHtml(item.name || '')}">` : ''}</div>
          <div class="meta">
            <div class="name">${escapeHtml(item.name || 'Untitled')}</div>
            <div class="sub">${escapeHtml(item.category || '')}${item.color ? ' · ' + escapeHtml(item.color) : ''}</div>
          </div>`;
        card.addEventListener('click', () => openDetail(item.id));
        grid.appendChild(card);
      }
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ---------- Item detail popup ----------
    const detailBackdrop = document.getElementById('detail-backdrop');
    let detailItemId = null;

    function openDetail(id){
      const item = closetCache.find(i => i.id === id);
      if (!item) return;
      detailItemId = id;

      document.getElementById('detail-name').textContent = item.name || 'Untitled';
      document.getElementById('detail-photo-wrap').innerHTML = item.image_url
        ? `<img src="${item.image_url}" style="width:100%; height:100%; object-fit:cover;">`
        : `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--navy-dim); font-size:12px;">No photo</div>`;

      const d = item.descriptor || {};
      const tags = [item.category, item.color, item.fit, item.silhouette].filter(Boolean);
      (Array.isArray(d.style_tags) ? d.style_tags : (item.style ? item.style.split(',').map(s => s.trim()) : []))
        .forEach(t => t && tags.push(t));
      document.getElementById('detail-tags').innerHTML = tags.map(t =>
        `<span class="cat-pill active" style="cursor:default;">${escapeHtml(t)}</span>`
      ).join('');

      const fieldRows = [];
      if (item.caption) fieldRows.push(['Caption', item.caption]);
      if (d.fabric) fieldRows.push(['Fabric', d.fabric]);
      if (d.pairs_with) fieldRows.push(['Pairs well with', d.pairs_with]);
      if (d.avoid_with) fieldRows.push(['Avoid with', d.avoid_with]);
      if (d.condition_notes) fieldRows.push(['Condition', d.condition_notes]);
      if (item.created_at) fieldRows.push(['Added', new Date(item.created_at).toLocaleDateString()]);
      document.getElementById('detail-fields').innerHTML = fieldRows.map(([label, val]) =>
        `<div><b style="color:var(--navy);">${escapeHtml(label)}:</b> ${escapeHtml(val)}</div>`
      ).join('') || '<div>No extra details for this piece yet.</div>';

      document.getElementById('detail-status').classList.remove('show', 'is-error');
      detailBackdrop.classList.add('show');
    }
    function closeDetail(){
      detailBackdrop.classList.remove('show');
      detailItemId = null;
    }
    document.getElementById('btn-close-detail').addEventListener('click', closeDetail);
    document.getElementById('btn-close-detail-2').addEventListener('click', closeDetail);
    detailBackdrop.addEventListener('click', (e) => { if (e.target === detailBackdrop) closeDetail(); });

    document.getElementById('btn-delete-item').addEventListener('click', async () => {
      if (!detailItemId) return;
      const btn = document.getElementById('btn-delete-item');
      const statusEl = document.getElementById('detail-status');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span>Deleting…';

      const { error } = await sb.from('clothing_items').delete().eq('id', detailItemId);

      btn.disabled = false;
      btn.textContent = 'Delete item';

      if (error) {
        statusEl.textContent = error.message || "Couldn't delete that item.";
        statusEl.classList.add('show', 'is-error');
        return;
      }
      closeDetail();
      await loadCloset();
    });

    // Supabase's functions.invoke() throws a generic "non-2xx status code"
    // error without surfacing what the function actually said. This pulls
    // the real error body (most edge functions return {"error": "..."} on
    // failure) so the message shown to the user is actually useful.
    async function invokeEdgeFunction(name, body){
      const { data, error } = await sb.functions.invoke(name, { body });
      if (error) {
        let detail = error.message || 'Request failed.';
        if (error.context) {
          try {
            const cloned = error.context.clone ? error.context.clone() : error.context;
            const json = await cloned.json();
            detail = json.error || json.message || JSON.stringify(json);
          } catch (_) {
            try { detail = await error.context.text(); } catch (_) { /* keep default */ }
          }
        }
        throw new Error(detail);
      }
      return data;
    }

    // ---------- Add Item modal ----------
    const backdrop = document.getElementById('add-backdrop');
    const stepPhoto = document.getElementById('step-photo');
    const stepReview = document.getElementById('step-review');
    const dropzone = document.getElementById('dropzone');
    const dzPlaceholder = document.getElementById('dz-placeholder');
    const previewImg = document.getElementById('preview-img');
    const btnFindPieces = document.getElementById('btn-find-pieces');
    const stepPhotoError = document.getElementById('step-photo-error');

    let sourceFile = null;
    let sourceImageEl = null; // Image() loaded from the picked file, for canvas cropping

    function openModal(){
      backdrop.classList.add('show');
      resetToStepPhoto();
    }
    function closeModal(){
      backdrop.classList.remove('show');
    }
    document.getElementById('btn-open-add').addEventListener('click', openModal);
    document.getElementById('btn-open-add-empty').addEventListener('click', openModal);
    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });

    function resetToStepPhoto(){
      stepReview.style.display = 'none';
      stepPhoto.style.display = 'block';
      document.getElementById('modal-title').textContent = 'New item';
      stepPhotoError.textContent = '';
    }

    ['file-camera', 'file-library'].forEach(id => {
      document.getElementById(id).addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        sourceFile = file;
        const reader = new FileReader();
        reader.onload = () => {
          previewImg.src = reader.result;
          previewImg.style.display = 'block';
          dzPlaceholder.style.display = 'none';
          btnFindPieces.disabled = false;
          stepPhotoError.textContent = '';
          sourceImageEl = new Image();
          sourceImageEl.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    });

    // ---------- Step 1 -> Step 2: upload + call analyze-item (mode: detect) ----------
    //
    // NOTE ON THE EDGE FUNCTION CONTRACT: this mirrors the Swift app's
    // AddItemView → ClosetAIDetection.detectItems(...) flow, but that helper
    // (ClosetAIDetection.swift) wasn't part of what you shared, so the exact
    // request/response field names below are inferred from AIDetectedItem's
    // usage in AIDetectedItemsReviewView + ClosetStore.addDetectedItem. If
    // your real `analyze-item` "detect" mode uses different key names
    // (especially the bounding-box field), adjust `renderReviewRow` and the
    // request body below to match — everything else in this flow is
    // independent of that shape.
    btnFindPieces.addEventListener('click', async () => {
      if (!sourceFile) return;
      btnFindPieces.disabled = true;
      btnFindPieces.innerHTML = '<span class="spin"></span>Finding your pieces…';
      stepPhotoError.textContent = '';

      try {
        // `detect` mode gets the image inline as base64 — mirroring how the
        // Swift app calls ClosetAIDetection.detectItems(in: image, ...)
        // directly on the picked UIImage with no upload step first. (The
        // "missing_image" error means the function is checking for a body
        // field it isn't finding — `image_url` was the wrong shape for this
        // mode; extract_all and single mode DO use image_url/item_id, per
        // ClosetStore.swift, so this mismatch is specific to detect.)
        const base64 = await fileToBase64(sourceFile);

        const data = await invokeEdgeFunction('analyze-item', {
          mode: 'detect',
          image: base64,
          mime_type: sourceFile.type || 'image/jpeg'
        });
        if (!data) throw new Error('No response from detection.');
        if (data.ok === false) throw new Error(data.error || 'Detection failed.');

        const items = data.data?.items || data.items || [];
        if (!items.length) throw new Error("Didn't spot any clothing in that photo — try a clearer shot.");

        renderReview(items);
      } catch (err) {
        stepPhotoError.textContent = err.message || 'Something went wrong analyzing that photo.';
      } finally {
        btnFindPieces.disabled = false;
        btnFindPieces.textContent = 'Find my pieces';
      }
    });

    // Reads a File as base64 (no "data:...;base64," prefix — most
    // Gemini-backed edge functions expect the raw base64 payload plus a
    // separate mime_type field).
    function fileToBase64(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ---------- Step 2: review + crop ----------
    const reviewList = document.getElementById('review-list');
    const reviewSubhead = document.getElementById('review-subhead');
    let reviewRows = []; // { detected, include, name, color, category, croppedDataUrl }

    function renderReview(detectedItems){
      reviewRows = detectedItems.map(d => ({
        detected: d,
        include: !d.is_duplicate,
        name: d.name || d.type || '',
        color: d.color || (Array.isArray(d.colors) ? d.colors[0] : '') || '',
        category: d.category || CATEGORIES[0],
        croppedDataUrl: cropToDataUrl(d)
      }));

      reviewSubhead.textContent = reviewRows.some(r => r.detected.is_duplicate)
        ? "A few of these look like items you already have — they're unchecked, but you can add them anyway."
        : "Check everything you'd like to add, tweak anything that's off, then save.";

      document.getElementById('modal-title').textContent =
        reviewRows.length === 1 ? 'Found 1 piece' : `Found ${reviewRows.length} pieces`;

      stepPhoto.style.display = 'none';
      stepReview.style.display = 'block';
      document.getElementById('save-status').classList.remove('show');

      paintReviewList();
    }

    // Crops the picked photo to each item's bounding box on a canvas, so we
    // don't have to re-fetch/re-decode the uploaded image. Assumes a
    // normalized box `{x, y, width, height}` in 0..1 (fraction of the full
    // photo) — matching what `productImage(from:)` would need on the Swift
    // side. Falls back to the full photo if no box is present.
    function cropToDataUrl(detected){
      if (!sourceImageEl || !sourceImageEl.width) return previewImg.src;
      const box = detected.box || detected.bounding_box || null;
      const iw = sourceImageEl.naturalWidth, ih = sourceImageEl.naturalHeight;

      const canvas = document.createElement('canvas');
      const size = 400;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);

      if (box) {
        const sx = box.x * iw, sy = box.y * ih, sw = box.width * iw, sh = box.height * ih;
        const scale = Math.min(size / sw, size / sh);
        const dw = sw * scale, dh = sh * scale;
        ctx.drawImage(sourceImageEl, sx, sy, sw, sh, (size - dw) / 2, (size - dh) / 2, dw, dh);
      } else {
        const scale = Math.min(size / iw, size / ih);
        const dw = iw * scale, dh = ih * scale;
        ctx.drawImage(sourceImageEl, 0, 0, iw, ih, (size - dw) / 2, (size - dh) / 2, dw, dh);
      }
      return canvas.toDataURL('image/jpeg', 0.9);
    }

    function paintReviewList(){
      reviewList.innerHTML = '';
      reviewRows.forEach((row, i) => {
        const el = document.createElement('div');
        el.className = 'review-row' + (row.include ? '' : ' excluded');
        el.innerHTML = `
          <div class="check"><input type="checkbox" ${row.include ? 'checked' : ''} data-i="${i}" class="chk"></div>
          <div class="thumb"><img src="${row.croppedDataUrl}"></div>
          <div class="fields">
            ${row.detected.is_duplicate ? '<span class="dup-badge">Already in your closet</span><br>' : ''}
            <input type="text" value="${escapeHtml(row.name)}" data-i="${i}" data-field="name" placeholder="Name">
            <input type="text" value="${escapeHtml(row.color)}" data-i="${i}" data-field="color" placeholder="Colour">
            <div class="cat-row">
              ${CATEGORIES.map(c => `<button type="button" class="cat-pill ${row.category === c ? 'active' : ''}" data-i="${i}" data-cat="${c}">${c}</button>`).join('')}
            </div>
          </div>`;
        reviewList.appendChild(el);
      });

      reviewList.querySelectorAll('.chk').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const i = +e.target.dataset.i;
          reviewRows[i].include = e.target.checked;
          paintReviewList();
        });
      });
      reviewList.querySelectorAll('input[data-field]').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const i = +e.target.dataset.i, field = e.target.dataset.field;
          reviewRows[i][field] = e.target.value;
        });
      });
      reviewList.querySelectorAll('.cat-pill').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const i = +e.target.dataset.i;
          reviewRows[i].category = e.target.dataset.cat;
          paintReviewList();
        });
      });
    }

    document.getElementById('btn-back-to-photo').addEventListener('click', resetToStepPhoto);

    // ---------- Step 2 -> save ----------
    // Mirrors ClosetStore.addDetectedItem: upload the cropped image, then
    // insert a row carrying the descriptor the detect call already computed
    // (no second AI call per item).
    document.getElementById('btn-save-items').addEventListener('click', async () => {
      const included = reviewRows.filter(r => r.include);
      const statusEl = document.getElementById('save-status');
      const btn = document.getElementById('btn-save-items');
      if (!included.length) {
        statusEl.textContent = 'Nothing selected.';
        statusEl.classList.add('show', 'is-error');
        return;
      }

      btn.disabled = true;
      let saved = 0;
      statusEl.classList.remove('is-error');
      statusEl.classList.add('show');

      for (const row of included) {
        statusEl.textContent = `Adding ${saved + 1}/${included.length}…`;
        try {
          const blob = await (await fetch(row.croppedDataUrl)).blob();
          const path = `${currentUser.id}/${crypto.randomUUID()}.jpg`;
          const { error: upErr } = await sb.storage.from('clothing').upload(path, blob, { contentType: 'image/jpeg' });
          if (upErr) throw upErr;
          const { data: pub } = sb.storage.from('clothing').getPublicUrl(path);

          const d = row.detected;
          const { error: insErr } = await sb.from('clothing_items').insert({
            name: row.name.trim(),
            color: row.color.trim() || null,
            category: row.category,
            fit: d.fit || null,
            silhouette: d.silhouette || null,
            style: Array.isArray(d.style_tags) ? d.style_tags.join(', ') : (d.style || null),
            image_url: pub.publicUrl,
            caption: d.caption || null,
            analysis_status: 'done',
            analyzed_at: new Date().toISOString(),
            descriptor: {
              v: 1,
              type: d.type || row.category,
              category: row.category,
              colors: d.colors || (row.color ? [row.color] : []),
              fabric: d.fabric || null,
              fit: d.fit || null,
              silhouette: d.silhouette || null,
              style_tags: d.style_tags || [],
              formality: d.formality ?? null,
              warmth: d.warmth ?? null,
              layer_slot: d.layer_slot || null,
              statement: d.statement ?? null,
              pairs_with: d.pairs_with || null,
              avoid_with: d.avoid_with || null,
              condition_notes: d.condition_notes || null
            }
          });
          if (insErr) throw insErr;
          saved++;
        } catch (err) {
          statusEl.textContent = `Saved ${saved} so far — then hit a snag on "${row.name || 'that item'}". ${err.message || ''}`;
          statusEl.classList.add('is-error');
          btn.disabled = false;
          await loadCloset();
          return;
        }
      }

      statusEl.textContent = `Added ${saved} to your closet.`;
      btn.disabled = false;
      await loadCloset();
      setTimeout(closeModal, 900);
    });
  </script>
  </body>
  </html>
